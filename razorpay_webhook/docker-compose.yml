# ─────────────────────────────────────────────────────────────────────────────
#  docker-compose.yml — Razorpay Webhook Service (standalone)
#
#  Usage:
#    docker compose --env-file .env up -d
#    docker compose logs -f
#    docker compose down
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── Razorpay Webhook Receiver ───────────────────────────────────────────────
  webhook:
    build:
      context: .
      dockerfile: Dockerfile
    image: medbot-razorpay-webhook:latest
    container_name: razorpay-webhook

    # Load all env vars from .env
    env_file: .env

    ports:
      - "${WEBHOOK_PORT:-8000}:8000"

    restart: unless-stopped

    # Healthcheck via Docker (mirrors the Dockerfile HEALTHCHECK)
    healthcheck:
      test: ["CMD", "python", "-c",
             "import httpx; r=httpx.get('http://localhost:8000/health',timeout=4); exit(0 if r.status_code==200 else 1)"]
      interval: 30s
      timeout:  5s
      retries:  3
      start_period: 10s

    # Structured JSON logging for production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    # Resource limits (adjust based on your VPS)
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

    labels:
      - "com.medbot.service=razorpay-webhook"
      - "com.medbot.version=1.0.0"
